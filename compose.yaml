services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: formula_insights
      POSTGRES_USER: formula_insights
      POSTGRES_PASSWORD: formula_insights
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formula_insights -d formula_insights"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
